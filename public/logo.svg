<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#000" />
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#bg)" stroke="#00ff41" stroke-width="3" filter="url(#neon)" />
  
  <path d="M 25 30 L 50 50 L 25 70" fill="none" stroke="#00ff41" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)" />
  
  <line x1="60" y1="70" x2="80" y2="70" stroke="#00ff41" stroke-width="8" stroke-linecap="round" filter="url(#neon)" />
</svg>